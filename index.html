<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>PointBlank</title><style>
  :root { --bg:#0b0b0b; --fg:#f2f0ee; --muted:#9a9794; --red:#e8222b; --rule:#2a2a2a; }
  body { background:var(--bg); color:var(--fg); font-family:Georgia,"Times New Roman",serif; margin:0; }
  main { max-width:680px; margin:0 auto; padding:24px 16px 80px; line-height:1.65; font-size:1.08rem; }
  header { border-bottom:1px solid var(--rule); padding:18px 16px; text-align:center; }
  header a { color:var(--fg); text-decoration:none; font-size:2rem; font-weight:700; letter-spacing:-0.5px; }
  .dot { color:var(--red); }
  h1 { font-size:2rem; line-height:1.2; margin:28px 0 8px; }
  h2 { font-size:1.3rem; margin:32px 0 6px; }
  .dek { color:var(--muted); font-style:italic; margin:0 0 20px; }
  img { width:100%; border-radius:6px; margin:12px 0; }
  hr { border:0; border-top:1px solid var(--rule); margin:32px 0; }
  .meta, footer { color:var(--muted); font-size:0.85rem; }
  a { color:var(--fg); }
  ul.posts { list-style:none; padding:0; } ul.posts li { padding:16px 0; border-bottom:1px solid var(--rule); }
  ul.posts a { text-decoration:none; font-size:1.25rem; font-weight:700; }</style></head>
<body><header><a href="./">PointBlank<span class="dot">.</span></a></header><main><ul class="posts"></ul>
<footer><hr>Drafted with AI tools. Every fact is sourced from named reporting and checked before publishing.</footer></main></body></html>
